services:
  - type: web
    name: anime-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SUPER_ADMIN_USERNAME
        value: jumaboyev101
      - key: SUPER_ADMIN_SETUP_CODE
        sync: false
